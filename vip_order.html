<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 우수거래조합원 명절선물신청</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- 카카오 도로명주소 API -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>
    body { background: #f8f9fa; }
    .card-product { 
      cursor: pointer; 
      transition: transform .2s, border .2s; 
      border: 2px solid transparent;
      position: relative;
    }
    .card-product:hover { 
      transform: scale(1.05); 
      box-shadow:0 6px 18px rgba(0,0,0,.1); 
    }
    .card-product.selected {
      border: 3px solid #0d6efd;   /* 파란색 테두리 */
      box-shadow: 0 0 10px rgba(13,110,253,.5);
    }
    .badge-selected {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #0d6efd;
      color: white;
      font-size: .8rem;
      padding: .3em .6em;
      border-radius: 1rem;
    }
    .swal2-popup { font-size: 1rem !important; }
  </style>
</head>
<body>

<div class="container py-4">
  <h3 class="mb-4 text-center">🎁 우수거래조합원 명절선물 신청하기</h3>

  <form id="orderForm" class="card p-4 shadow-sm border-0">
    <div class="mb-3">
      <label class="form-label">🙋 성명</label>
      <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">📱 연락처</label>
      <input type="tel" name="tel" class="form-control" placeholder="숫자만입력하세요" required>
    </div>

    <!-- 상품선택 -->
    <div class="mb-3">
      <label class="form-label">🛍️ 선물을 선택해 주세요(※아래 4종 택1)</label><br>
      <span>🧩자세한 상품정보는 특판몰을 참조해 주세요</span>
      <div class="row g-3">
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'잔스빌2호&건강한참치세트9호')">
            <img src="https://ajou9770.cafe24.com/web/product/medium/202601/2b4c1c842d580a903786692c8295cf61.jpg" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">잔스빌2호&건강한참치세트9호</h6></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'오롯명절과일선물세트')">
            <img src="https://ajou9770.cafe24.com/web/product/medium/202601/1c7a3cd4141ac0f8a11539eff2f6df6b.png" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">오롯명절과일선물세트</h6></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'마트로시카폴딩3중냄비세트')">
            <img src="https://ajou9770.cafe24.com/web/product/medium/202601/afa7b24c78ade7781e0a650b0d694bca.jpg" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">마트로시카폴딩3중냄비세트</h6></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'쿠폰(모바일전송)')">
            <img src="img/vipcoupon_202602.png" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">🧩명절 특판몰 쿠폰(5만원권)</h6></div>
          </div>
        </div>
      </div>
      <input type="hidden" name="product" id="product" required>
    </div>

    <!-- 주소 입력 (상품A~C 선택 시만 보임) -->
    <div id="addressSection" style="display:none;">
      <div class="mb-3">
        <label class="form-label">🏠 배송지(도로명주소)</label>
        <div class="input-group">
          <input type="text" name="address" id="address" class="form-control" placeholder="우측에 주소검색하여 입력하세요" readonly>
          <button type="button" class="btn btn-outline-secondary" onclick="execDaumPostcode()">📍주소검색</button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">🏢 동,호수 등 상세주소</label>
        <input type="text" name="detailAddress" id="detailAddress" class="form-control">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">💬 기타 남기실 말씀(선택)</label>
      <textarea name="message" rows="2" class="form-control" placeholder="자유롭게 입력해주세요"></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2">
      ✅제출하기
    </button>
  </form>
</div>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxqQ-5qhlmgzcckiOkD5IkvY0pTtkojoB_Al2LPyA6GbXh2tpsEhLVUhjS_4vcs0srJ/exec"; 

   let couponNoticeShown = false; // ✅ 같은 세션에서 반복 팝업 방지(원하면 제거)

  function selectProduct(cardEl, name) {
    document.getElementById("product").value = name;

    // 모든 카드 선택 해제
    document.querySelectorAll('.card-product').forEach(el => {
      el.classList.remove('selected');
      const badge = el.querySelector('.badge-selected');
      if (badge) badge.remove();
    });

    // 현재 선택 카드 강조 + 배지 추가
    cardEl.classList.add('selected');
    const badge = document.createElement('div');
    badge.className = 'badge-selected';
    badge.innerText = '선택됨';
    cardEl.appendChild(badge);

    const shipItems = ["잔스빌2호&건강한참치세트9호","오롯명절과일선물세트","마트로시카폴딩3중냄비세트"];
    const isShip = shipItems.includes(name);
    const isCoupon = (name === "쿠폰(모바일전송)" || name.includes("쿠폰"));

    // 주소 입력창 표시/숨김
    if (isShip) {
      document.getElementById("addressSection").style.display = "block";
    } else {
      document.getElementById("addressSection").style.display = "none";
      // (권장) 값 초기화
      document.getElementById("address").value = "";
      document.getElementById("detailAddress").value = "";
    }

    // ✅ 쿠폰 선택 시 안내 Alert
    if (isCoupon && !couponNoticeShown) {
      couponNoticeShown = true;
      Swal.fire({
        icon: "info",
        title: "쿠폰 선택 안내",
        text: "📍쿠폰선택시 알림톡 배송지에 쿠폰번호가 즉시 발송됩니다.\n특판몰에 쿠폰등록후 사용해 주세요",
        confirmButtonText: "확인"
      });
      // 기본 alert로 하고 싶으면 아래로 교체 가능:
      // alert("📍쿠폰선택시 알림톡에 배송지에 쿠폰번호가 즉시 발송됩니다.\n특판몰에 쿠폰등록후 사용해 주세요");
    }
  }

  // 카카오 도로명주소 검색
  function execDaumPostcode() {
    new daum.Postcode({
      oncomplete: function(data) {
        document.getElementById("address").value = data.roadAddress;
      }
    }).open();
  }

  document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const data = {};
    formData.forEach((v, k) => data[k] = v);

    // ✅ 필수 입력값 검증
    if (!data.name || data.name.trim() === "") {
      Swal.fire("⚠️ 확인", "성명을 입력해주세요.", "warning");
      return;
    }
    if (!data.tel || data.tel.trim() === "") {
      Swal.fire("⚠️ 확인", "연락처를 입력해주세요.", "warning");
      return;
    }
    if (!data.product || data.product.trim() === "") {
      Swal.fire("⚠️ 확인", "선물을 선택해주세요.", "warning");
      return;
    }
    if (["동원참치선물세트10-5호","제스프리 썬골드키위 세트(18입)","마이키친 냄비3종세트"].includes(data.product)) {
      if (!data.address || data.address.trim() === "") {
        Swal.fire("⚠️ 확인", "배송지 주소를 입력해주세요.", "warning");
        return;
      }
      if (!data.detailAddress || data.detailAddress.trim() === "") {
        Swal.fire("⚠️ 확인", "상세주소를 입력해주세요.", "warning");
        return;
      }
    }

    // SweetAlert 확인창
    let confirmHtml = `
  <p>🙋 이름: <b>${data.name}</b></p>
  <p>📱 연락처: <b>${data.tel}</b></p>
  <p>🛍️ 선택 선물: <b>${data.product}</b></p>`;

const shipItems = ["동원참치선물세트10-5호","제스프리 썬골드키위 세트(18입)","마이키친 냄비3종세트"];

if (shipItems.includes(data.product)) {
  confirmHtml += `
    <p>🏠 주소: <b>${data.address || "-"}</b></p>
    <p>🏢 상세주소: <b>${data.detailAddress || "-"}</b></p>`;
} else if (data.product.includes("쿠폰")) {
  confirmHtml += `
    <div class="alert alert-info py-2 mb-2">
      ✅ 쿠폰번호는 제출 후 <b>카카오 알림톡의 배송지</b>로 즉시 발송됩니다.
    </div>`;
}

confirmHtml += `<p>💬 메세지: <b>${data.message || "-"}</b></p>`;


    const result = await Swal.fire({
      title:"제출 전 확인해주세요!",
      html: confirmHtml,
      icon:"question",
      showCancelButton:true,
      confirmButtonText:"제출하기",
      cancelButtonText:"취소"
    });
    if (!result.isConfirmed) return;

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "📤제출중...잠시만 기다려주세요";

    try {
      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" },
        mode: "no-cors"
      });
      /* Swal.fire("✅ 완료","잘 제출 되었습니다!","success"); */
      Swal.fire(
  "✅ 접수 완료",
  data.product.includes("쿠폰")
    ? "쿠폰번호는 카카오 알림톡으로 발송됩니다. 수신이 안되면 운영진에게 문의해주세요."
    : "잘 제출 되었습니다!",
  "success"
);
      form.reset();
      document.getElementById("addressSection").style.display = "none";

      // 선택 표시 초기화
      document.querySelectorAll('.card-product').forEach(el => {
        el.classList.remove('selected');
        const badge = el.querySelector('.badge-selected');
        if (badge) badge.remove();
      });

    } catch (err) {
      Swal.fire("❌ 오류","제출 중 문제가 발생했습니다.","error");
    } finally {
      btn.disabled = false;
      btn.textContent = "✔️ 제출하기";
    }
  });
</script>

</body>
</html>
