<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d6efd" />
    <title>우수거래조합원 명절선물 신청</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <style>
      :root {
        --brand: #0d6efd;
        --brand-dark: #084298;
        --bg: #f4f7fb;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --success: #198754;
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(
            circle at top right,
            rgba(13, 110, 253, 0.11),
            transparent 30rem
          ),
          linear-gradient(180deg, #f8fbff 0, #f4f7fb 45%, #eef2f7 100%);
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Noto Sans KR",
          sans-serif;
      }

      .page-wrap {
        width: min(980px, calc(100% - 24px));
        margin: 0 auto;
        padding: 24px 0 50px;
      }

      .hero {
        border-radius: 28px;
        padding: 28px 24px;
        color: #fff;
        background: linear-gradient(135deg, #0d6efd, #4f46e5);
        box-shadow: 0 18px 44px rgba(13, 110, 253, 0.2);
        margin-bottom: 18px;
        position: relative;
        overflow: hidden;
      }

      .hero::after {
        content: "🎁";
        position: absolute;
        right: 18px;
        bottom: -22px;
        font-size: 110px;
        opacity: 0.12;
        transform: rotate(-8deg);
      }

      .hero h1 {
        font-size: clamp(1.45rem, 4vw, 2.15rem);
        font-weight: 800;
        margin: 0 0 8px;
        letter-spacing: -0.03em;
      }

      .hero p {
        margin: 0;
        opacity: 0.92;
        font-size: 0.96rem;
      }

      .form-card {
        background: #fff;
        border: 1px solid rgba(229, 231, 235, 0.9);
        border-radius: var(--radius);
        box-shadow: 0 12px 35px rgba(31, 41, 55, 0.07);
        overflow: hidden;
      }

      .form-section {
        padding: 24px;
        border-bottom: 1px solid #eef1f5;
      }

      .form-section:last-child {
        border-bottom: 0;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 16px;
        font-weight: 800;
        font-size: 1.05rem;
      }

      .section-title .icon {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: #edf4ff;
        color: var(--brand);
      }

      .form-label {
        font-weight: 700;
        font-size: 0.94rem;
        margin-bottom: 7px;
      }

      .form-control {
        min-height: 48px;
        border-radius: 13px;
        border-color: #dce2ea;
      }

      textarea.form-control {
        min-height: 90px;
      }

      .form-control:focus {
        border-color: #86b7fe;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.1);
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .product-card {
        border: 2px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        background: #fff;
        cursor: pointer;
        transition: 0.18s ease;
        position: relative;
        min-width: 0;
      }

      .product-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(31, 41, 55, 0.11);
        border-color: #cbd5e1;
      }

      .product-card.selected {
        border-color: var(--brand);
        box-shadow:
          0 0 0 3px rgba(13, 110, 253, 0.1),
          0 12px 28px rgba(13, 110, 253, 0.14);
      }

      .product-image-wrap {
        aspect-ratio: 1.25/1;
        background: #f8fafc;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .product-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .product-card-body {
        padding: 14px;
      }

      .product-name {
        font-weight: 800;
        line-height: 1.35;
        font-size: 0.95rem;
        min-height: 2.6em;
        word-break: keep-all;
      }

      .product-desc {
        font-size: 0.82rem;
        color: var(--muted);
        margin-top: 6px;
        line-height: 1.45;
      }

      .selected-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 6px 10px;
        background: var(--brand);
        color: #fff;
        border-radius: 999px;
        font-weight: 800;
        font-size: 0.78rem;
        box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
      }

      .choice-check {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.94);
        color: #adb5bd;
        border: 1px solid #dee2e6;
        font-size: 1rem;
      }

      .product-card.selected .choice-check {
        color: #fff;
        background: var(--brand);
        border-color: var(--brand);
      }

      .coupon-panel {
        margin-top: 16px;
        border: 2px dashed #cfd8e3;
        border-radius: 18px;
        padding: 16px;
        background: #fbfcff;
        cursor: pointer;
        transition: 0.18s ease;
      }

      .coupon-panel:hover {
        border-color: #93b7ff;
        background: #f7faff;
      }

      .coupon-panel.selected {
        border-style: solid;
        border-color: var(--brand);
        background: #f3f7ff;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.08);
      }

      .coupon-title {
        font-weight: 800;
        font-size: 1rem;
      }

      .coupon-sub {
        color: var(--muted);
        font-size: 0.87rem;
        margin-top: 3px;
      }

      .info-box {
        background: #f8fafc;
        border: 1px solid #e7ebf0;
        border-radius: 15px;
        padding: 13px 15px;
        color: #4b5563;
        font-size: 0.88rem;
        line-height: 1.6;
      }

      #addressSection {
        display: none;
        animation: fadeIn 0.18s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .submit-area {
        padding: 20px 24px 24px;
        background: #fbfcfe;
      }

      .submit-btn {
        min-height: 54px;
        border-radius: 15px;
        font-size: 1.05rem;
        font-weight: 800;
        box-shadow: 0 8px 20px rgba(13, 110, 253, 0.18);
      }

      .required-mark {
        color: #dc3545;
      }

      .small-note {
        color: var(--muted);
        font-size: 0.83rem;
        margin-top: 7px;
      }

      .swal2-popup {
        font-size: 0.96rem !important;
        border-radius: 22px !important;
      }

      .swal-confirm {
        text-align: left;
        font-size: 0.94rem;
        line-height: 1.55;
      }

      .swal-confirm .line {
        padding: 7px 0;
        border-bottom: 1px solid #edf0f3;
      }

      .swal-confirm .line:last-child {
        border-bottom: 0;
      }

      @media (max-width: 767px) {
        .page-wrap {
          width: min(100% - 16px, 980px);
          padding-top: 12px;
        }

        .hero {
          border-radius: 22px;
          padding: 22px 18px;
        }

        .hero::after {
          font-size: 78px;
          right: 6px;
        }

        .form-section {
          padding: 19px 16px;
        }

        .product-grid {
          grid-template-columns: 1fr;
        }

        .product-card {
          display: grid;
          grid-template-columns: 116px 1fr;
          align-items: stretch;
        }

        .product-image-wrap {
          aspect-ratio: auto;
          min-height: 116px;
        }

        .product-name {
          min-height: auto;
        }

        .submit-area {
          padding: 16px;
          position: sticky;
          bottom: 0;
          z-index: 20;
          box-shadow: 0 -8px 24px rgba(31, 41, 55, 0.08);
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <section class="hero">
        <h1>우수거래조합원 명절선물 신청</h1>
        <p>
          원하시는 선물 1종을 선택해 주세요. 📍입력하신 주소로 🚚배송 됩니다.
        </p>
      </section>

      <form id="orderForm" class="form-card" novalidate>
        <section class="form-section">
          <div class="section-title">
            <span class="icon"><i class="bi bi-person-fill"></i></span>
            신청자 정보
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label"
                >성명 <span class="required-mark">*</span></label
              >
              <input
                type="text"
                name="name"
                id="name"
                class="form-control"
                maxlength="20"
                autocomplete="name"
                required
              />
            </div>

            <div class="col-md-6">
              <label class="form-label"
                >연락처 <span class="required-mark">*</span></label
              >
              <input
                type="tel"
                name="tel"
                id="tel"
                class="form-control"
                inputmode="numeric"
                autocomplete="tel"
                placeholder="숫자만 입력하세요"
                maxlength="13"
                required
              />
              <!-- <div class="small-note">
                쿠폰 선택 시 이 번호로 카카오 알림톡이 발송됩니다.
              </div> -->
            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="section-title">
            <span class="icon"><i class="bi bi-gift-fill"></i></span>
            선물 선택(택1)
          </div>

          <div class="mt-2 mb-3">
            <a
              href="https://ajoucu.com"
              target="_blank"
              rel="noopener noreferrer"
              class="badge rounded-pill text-bg-primary text-decoration-none px-3 py-2"
            >
              <i class="bi bi-box-arrow-up-right me-1"></i>
              자세한 상품내용은 신협 특판몰을 참조해 주세요
            </a>
          </div>

          <!-- <div class="info-box mb-3">
            <i class="bi bi-info-circle me-1"></i>
            아래 선물 중 <strong>1종</strong>을 선택해 주세요. 자세한 상품정보는
            특판몰을 참고해 주세요.
          </div> -->

          <div id="giftGrid" class="product-grid"></div>

          <!-- <div class="mt-4 mb-2 fw-bold">
            <i class="bi bi-ticket-perforated me-1"></i>
            또는 쿠폰 선택
          </div> -->

          <div id="couponArea"></div>

          <input type="hidden" name="product" id="product" />
          <input type="hidden" name="productType" id="productType" />
        </section>

        <section id="addressSection" class="form-section">
          <div class="section-title">
            <span class="icon"><i class="bi bi-truck"></i></span>
            배송지 입력
          </div>

          <div class="mb-3">
            <label class="form-label"
              >도로명주소 <span class="required-mark">*</span></label
            >
            <div class="input-group">
              <input
                type="text"
                name="address"
                id="address"
                class="form-control"
                placeholder="주소검색 버튼을 눌러주세요"
                readonly
              />
              <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="execDaumPostcode()"
              >
                <i class="bi bi-geo-alt-fill"></i> 주소검색
              </button>
            </div>
          </div>

          <div>
            <label class="form-label"
              >상세주소 <span class="required-mark">*</span></label
            >
            <input
              type="text"
              name="detailAddress"
              id="detailAddress"
              class="form-control"
              maxlength="100"
              placeholder="동·호수 등 상세주소를 입력하세요"
            />
          </div>
        </section>

        <section class="form-section">
          <div class="section-title">
            <span class="icon"><i class="bi bi-chat-dots-fill"></i></span>
            기타 말씀
          </div>

          <textarea
            name="message"
            id="message"
            rows="1"
            maxlength="300"
            class="form-control"
            placeholder="전달할 내용이 있으시면 입력해 주세요."
          ></textarea>
        </section>

        <div class="submit-area">
          <button
            type="submit"
            id="submitBtn"
            class="btn btn-primary submit-btn w-100"
          >
            <i class="bi bi-check-circle-fill me-1"></i> 신청내용 확인 및 제출
          </button>
        </div>
      </form>
    </div>

    <script>
      /* =========================================================
   1. 관리자용 설정 영역
   상품 변경 시 아래 배열만 수정하면 됩니다.
   - id       : 내부 식별값(가급적 변경하지 않음)
   - name     : 실제 저장될 상품명
   - image    : 상품 이미지
   - desc     : 화면 안내문구
   - type     : "gift" 또는 "coupon"
   - shipping : 배송주소 필요 여부
========================================================= */

      const CONFIG = {
        GAS_URL:
          "https://script.google.com/macros/s/AKfycbxqQ-5qhlmgzcckiOkD5IkvY0pTtkojoB_Al2LPyA6GbXh2tpsEhLVUhjS_4vcs0srJ/exec",

        products: [
          {
            id: "gift01",
            name: "정관장 홍삼비력(50ml*30포)",
            image:
              "https://ajou9770.cafe24.com/web/product/medium/202609/c3197153029cfb8a63f12e034920ab51.jpg",
            desc: "배송상품",
            type: "gift",
            shipping: true,
          },
          {
            id: "gift02",
            name: "해바 하우스감귤(3KG)",
            image:
              "https://ajou9770.cafe24.com/web/product/medium/202609/636a2718d39b692f8019f3bff461a42c.png",
            desc: "배송상품",
            type: "gift",
            shipping: true,
          },
          {
            id: "gift03",
            name: "생돌김 혼합세트6호",
            image:
              "https://ajou9770.cafe24.com/web/product/medium/202608/e3663b5274b4847a801c6a09e313db94.jpg",
            desc: "배송상품",
            type: "gift",
            shipping: true,
          },

          //4번째 선물을 추가하려면 아래 형식으로 한 묶음만 추가하면 됩니다.
          {
            id: "gift04",
            name: "숯불 떡갈비명품1호 세트(수제10,청양2,표고2)",
            image:
              "https://ajou9770.cafe24.com/web/product/medium/202609/95f8d5a7f544b7b0ed2ba3e656f60009.png",
            desc: "배송상품",
            type: "gift",
            shipping: true,
          },

          // 쿠폰선택섹트
          /* {
            id: "coupon01",
            name: "명절 특판몰 쿠폰(5만원권)",
            image: "img/vipcoupon_202602.png",
            desc: "카카오 알림톡으로 쿠폰번호 즉시 발송",
            type: "coupon",
            shipping: false,
          }, */
        ],
      };

      let selectedProduct = null;
      let couponNoticeShown = false;

      const giftGrid = document.getElementById("giftGrid");
      const couponArea = document.getElementById("couponArea");
      const productInput = document.getElementById("product");
      const productTypeInput = document.getElementById("productType");
      const addressSection = document.getElementById("addressSection");

      function escapeHtml(value = "") {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderProducts() {
        const gifts = CONFIG.products.filter((item) => item.type === "gift");
        const coupons = CONFIG.products.filter(
          (item) => item.type === "coupon",
        );

        giftGrid.innerHTML = gifts
          .map(
            (item) => `
    <div class="product-card" role="button" tabindex="0"
         data-id="${escapeHtml(item.id)}"
         aria-label="${escapeHtml(item.name)} 선택">
      <div class="choice-check"><i class="bi bi-check-lg"></i></div>
      <div class="product-image-wrap">
        <img src="${escapeHtml(item.image)}"
             alt="${escapeHtml(item.name)}"
             loading="lazy"
             onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22400%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23f1f3f5%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23868e96%22 font-size=%2224%22%3E상품 이미지%3C/text%3E%3C/svg%3E'">
      </div>
      <div class="product-card-body">
        <div class="product-name">${escapeHtml(item.name)}</div>
        <div class="product-desc">${escapeHtml(item.desc || "")}</div>
      </div>
    </div>
  `,
          )
          .join("");

        couponArea.innerHTML = coupons
          .map(
            (item) => `
    <div class="coupon-panel" role="button" tabindex="0"
         data-id="${escapeHtml(item.id)}"
         aria-label="${escapeHtml(item.name)} 선택">
      <div class="d-flex align-items-center gap-3">
        <div class="flex-shrink-0">
          <div class="rounded-3 overflow-hidden bg-white border"
               style="width:74px;height:74px;">
            <img src="${escapeHtml(item.image)}"
                 alt="${escapeHtml(item.name)}"
                 style="width:100%;height:100%;object-fit:cover;">
          </div>
        </div>
        <div class="flex-grow-1">
          <div class="coupon-title">${escapeHtml(item.name)}</div>
          <div class="coupon-sub">${escapeHtml(item.desc || "")}</div>
        </div>
        <div class="fs-4 text-primary">
          <i class="bi bi-chevron-right"></i>
        </div>
      </div>
    </div>
  `,
          )
          .join("");

        document.querySelectorAll("[data-id]").forEach((el) => {
          el.addEventListener("click", () => selectProduct(el.dataset.id));
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selectProduct(el.dataset.id);
            }
          });
        });
      }

      function selectProduct(id) {
        const item = CONFIG.products.find((p) => p.id === id);
        if (!item) return;

        selectedProduct = item;
        productInput.value = item.name;
        productTypeInput.value = item.type;

        document
          .querySelectorAll(".product-card, .coupon-panel")
          .forEach((el) => {
            el.classList.remove("selected");
            const badge = el.querySelector(".selected-badge");
            if (badge) badge.remove();
          });

        const selectedEl = document.querySelector(
          `[data-id="${CSS.escape(id)}"]`,
        );
        if (selectedEl) {
          selectedEl.classList.add("selected");

          if (selectedEl.classList.contains("product-card")) {
            const badge = document.createElement("div");
            badge.className = "selected-badge";
            badge.textContent = "선택됨";
            selectedEl.appendChild(badge);
          }
        }

        if (item.shipping) {
          addressSection.style.display = "block";
        } else {
          addressSection.style.display = "none";
          document.getElementById("address").value = "";
          document.getElementById("detailAddress").value = "";
        }

        if (item.type === "coupon" && !couponNoticeShown) {
          couponNoticeShown = true;
          Swal.fire({
            icon: "info",
            title: "쿠폰 선택 안내",
            html: `
        <div style="line-height:1.7">
          쿠폰번호는 신청 완료 후<br>
          <strong>카카오 알림톡으로 즉시 발송</strong>됩니다.<br><br>
          특판몰에 쿠폰을 등록한 뒤 사용해 주세요.
        </div>
      `,
            confirmButtonText: "확인",
          });
        }
      }

      function execDaumPostcode() {
        new daum.Postcode({
          oncomplete: function (data) {
            const address = data.roadAddress || data.jibunAddress || "";
            document.getElementById("address").value = address;
            document.getElementById("detailAddress").focus();
          },
        }).open();
      }

      function normalizePhone(value) {
        return String(value || "").replace(/\D/g, "");
      }

      document.getElementById("tel").addEventListener("input", (e) => {
        e.target.value = normalizePhone(e.target.value).slice(0, 11);
      });

      function validateForm(data) {
        if (!data.name.trim()) {
          return ["성명을 입력해 주세요.", "name"];
        }

        const phone = normalizePhone(data.tel);
        if (!/^01\d{8,9}$/.test(phone)) {
          return ["연락처를 정확히 입력해 주세요.", "tel"];
        }

        if (!selectedProduct) {
          return ["선물을 선택해 주세요.", null];
        }

        if (selectedProduct.shipping) {
          if (!data.address.trim()) {
            return ["배송지 주소를 입력해 주세요.", "address"];
          }
          if (!data.detailAddress.trim()) {
            return ["상세주소를 입력해 주세요.", "detailAddress"];
          }
        }

        return null;
      }

      function buildConfirmHtml(data) {
        const safe = {
          name: escapeHtml(data.name),
          tel: escapeHtml(data.tel),
          product: escapeHtml(selectedProduct?.name || ""),
          address: escapeHtml(data.address || ""),
          detailAddress: escapeHtml(data.detailAddress || ""),
          message: escapeHtml(data.message || "-"),
        };

        let html = `
    <div class="swal-confirm">
      <div class="line">🙋 신청자 <strong>${safe.name}</strong></div>
      <div class="line">📱 연락처 <strong>${safe.tel}</strong></div>
      <div class="line">🎁 선택상품 <strong>${safe.product}</strong></div>
  `;

        if (selectedProduct?.shipping) {
          html += `
      <div class="line">🏠 배송지 <strong>${safe.address}</strong></div>
      <div class="line">🏢 상세주소 <strong>${safe.detailAddress}</strong></div>
    `;
        } else if (selectedProduct?.type === "coupon") {
          html += `
      <div class="alert alert-primary mt-3 mb-2 py-2">
        쿠폰번호는 제출 완료 후 카카오 알림톡으로 발송됩니다.
      </div>
    `;
        }

        html += `
      <div class="line">💬 기타말씀 <strong>${safe.message}</strong></div>
    </div>
  `;

        return html;
      }

      document
        .getElementById("orderForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const form = e.currentTarget;
          const formData = new FormData(form);
          const data = Object.fromEntries(formData.entries());

          data.tel = normalizePhone(data.tel);

          const validation = validateForm(data);
          if (validation) {
            await Swal.fire({
              icon: "warning",
              title: "확인해 주세요",
              text: validation[0],
              confirmButtonText: "확인",
            });

            if (validation[1]) {
              document.getElementById(validation[1])?.focus();
            }
            return;
          }

          const result = await Swal.fire({
            title: "이 내용으로 신청할까요?",
            html: buildConfirmHtml(data),
            icon: "question",
            showCancelButton: true,
            confirmButtonText: "신청하기",
            cancelButtonText: "다시 확인",
          });

          if (!result.isConfirmed) return;

          const btn = document.getElementById("submitBtn");
          const originalText = btn.innerHTML;

          btn.disabled = true;
          btn.innerHTML =
            '<span class="spinner-border spinner-border-sm me-2"></span>제출 중입니다...';

          try {
            await fetch(CONFIG.GAS_URL, {
              method: "POST",
              body: JSON.stringify(data),
              headers: { "Content-Type": "application/json" },
              mode: "no-cors",
            });

            await Swal.fire({
              icon: "success",
              title: "접수 완료",
              text:
                selectedProduct?.type === "coupon"
                  ? "쿠폰번호는 카카오 알림톡으로 발송됩니다. 수신되지 않으면 운영진에게 문의해 주세요."
                  : "명절선물 신청이 정상적으로 접수되었습니다.",
              confirmButtonText: "확인",
            });

            form.reset();
            selectedProduct = null;
            productInput.value = "";
            productTypeInput.value = "";
            addressSection.style.display = "none";

            document
              .querySelectorAll(".product-card, .coupon-panel")
              .forEach((el) => {
                el.classList.remove("selected");
                el.querySelector(".selected-badge")?.remove();
              });

            window.scrollTo({ top: 0, behavior: "smooth" });
          } catch (err) {
            console.error(err);
            Swal.fire({
              icon: "error",
              title: "제출 오류",
              text: "제출 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.",
              confirmButtonText: "확인",
            });
          } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
          }
        });

      renderProducts();
    </script>
  </body>
</html>
