<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 고우회 명절선물신청</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- 카카오 도로명주소 API -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>
    body { background: #f8f9fa; }
    .card-product { 
      cursor: pointer; 
      transition: transform .2s, border .2s; 
      border: 2px solid transparent;
      position: relative;
    }
    .card-product:hover { 
      transform: scale(1.05); 
      box-shadow:0 6px 18px rgba(0,0,0,.1); 
    }
    .card-product.selected {
      border: 3px solid #0d6efd;   /* 파란색 테두리 */
      box-shadow: 0 0 10px rgba(13,110,253,.5);
    }
    .badge-selected {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #0d6efd;
      color: white;
      font-size: .8rem;
      padding: .3em .6em;
      border-radius: 1rem;
    }
    .swal2-popup { font-size: 1rem !important; }
  </style>
</head>
<body>

<div class="container py-4">
  <h3 class="mb-4 text-center">🎁 고우회 명절선물 신청하기</h3>

  <form id="orderForm" class="card p-4 shadow-sm border-0">
    <!-- <div class="mb-3">
      <label class="form-label">🙋 성명</label>
      <input type="text" name="name" class="form-control" required>
    </div> -->
    <div class="mb-3">
  <label class="form-label">🙋 성명</label>
  <input list="nameList" type="text" name="name" class="form-control" placeholder="이름을 입력하거나 선택하세요" required>
  <datalist id="nameList">
    <option value="권세혁">
    <option value="권용석">
    <option value="김경덕">
    <option value="김동석">
    <option value="김상섭">
    <option value="김설호">
    <option value="김태동">
    <option value="박수영">
    <option value="박종호">
    <option value="손병욱">
    <option value="최진철">
    <option value="정승교">
    <option value="정재영">
    <option value="황춘석">
  </datalist>
</div>


    <div class="mb-3">
      <label class="form-label">📱연락처</label>
      <input type="tel" name="tel" class="form-control" placeholder="숫자만입력하세요" required>
    </div>

    <!-- 상품선택 -->
    <div class="mb-3">
      <label class="form-label">🛍️ 선물을 선택해 주세요</label><br>
      <span>🧩자세한 상품정보는 특판몰을 참조해 주세요</span>
      <div class="row g-3">
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'동원참치선물세트18호')">
            <img src="https://ajoucu.com/web/product/medium/202601/fc25443d3689906fa6b3cb30de80b3a5.jpg" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">동원참치선물세트18호</h6></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'제주천혜향 4KG(9~12과)')">
            <img src="https://ajoucu.com/web/product/medium/202301/9133e8daf9d4cbc2ba56c319dc1cd0cf.jpg" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">제주천혜향 4KG(9~12과)</h6></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'스텐냄비 4종세트')">
            <img src="https://ajoucu.com/web/product/medium/202601/a3b7fa9997666bf09d009af1903d1950.jpg" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">스텐냄비 4종세트</h6></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'한입LA갈비&돈황구이(2KG)')">
            <img src="https://ajoucu.com/web/product/medium/202601/d98aadc0c8841e678e9dafaba380da2a.png" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">한입LA갈비&돈황구이(2KG)</h6></div>
          </div>
        </div>
      </div>
      <input type="hidden" name="product" id="product" required>
    </div>

    <!-- 주소 입력 (상품A~C 선택 시만 보임) -->
    <!-- 주소 입력 (주소 필요한 상품 선택 시만 보임) -->
<div id="addressSection" style="display:none;">
  <!-- ✅ 주소확인/상태 -->
  <div class="mb-2 d-flex gap-2">
    <button type="button" id="btnAddrCheck" class="btn btn-outline-primary w-100" onclick="checkAddressFromSheet()">
      📌 주소확인
    </button>
  </div>

  <!-- ✅ 시트에서 불러온 주소 미리보기 -->
  <div id="addrPreview" class="alert alert-primary py-3 d-none">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <div class="fw-semibold mb-1">✅ 등록된 주소가 아래와 같습니다. 맞으면 바로 제출하세요.</div>
        <div class="small text-muted">다른경우, 아래 “변경하기”를 누르면 수정할 수 있어요.</div>
      </div>
      <span class="badge bg-primary">자동불러옴</span>
    </div>

    <hr class="my-2">

    <div class="mb-2">
      <div class="text-muted small">주소</div>
      <div id="previewAddress" class="fw-bold"></div>
    </div>
    <div>
      <div class="text-muted small">상세주소</div>
      <div id="previewDetail" class="fw-bold"></div>
    </div>

    <div class="d-grid gap-2 mt-3">
      <button type="button" id="btnAddrEdit" class="btn btn-outline-secondary" onclick="enableAddressEdit()">
        ✏️ 변경하기
      </button>
    </div>
  </div>

  <!-- ✅ 실제 제출되는 입력값(주소/상세주소) -->
  <div class="mt-3">
    <label class="form-label">🏠 배송지(도로명주소)</label>
    <div class="input-group">
      <input type="text" name="address" id="address" class="form-control"
             placeholder="주소확인 후 자동으로 표시됩니다" readonly>
      <button type="button" id="btnAddrSearch" class="btn btn-outline-secondary d-none" onclick="execDaumPostcode()">
        📍주소검색
      </button>
    </div>
  </div>

  <div class="mt-2">
    <label class="form-label">🏢 동,호수 등 상세주소</label>
    <input type="text" name="detailAddress" id="detailAddress" class="form-control"
           placeholder="주소확인 후 자동으로 표시됩니다" readonly>
  </div>

  <!-- ✅ 변경 모드 버튼 -->
  <div id="addrEditActions" class="d-none mt-3">
    <div class="d-grid gap-2">
      <button type="button" class="btn btn-success" onclick="confirmAddressEdit()">✅ 변경완료</button>
      <button type="button" class="btn btn-outline-secondary" onclick="cancelAddressEdit()">↩️ 취소(원래주소)</button>
    </div>
  </div>

  <!-- ✅ 제출용 히든 -->
  <input type="hidden" name="addr_source" id="addr_source" value="">
  <input type="hidden" name="addr_updated" id="addr_updated" value="0">
</div>


    <div class="mb-3">
      <label class="form-label">💬 기타 남기실 말씀</label>
      <textarea name="message" rows="2" class="form-control" placeholder="자유롭게 입력해주세요"></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2">
      ✅제출하기
    </button>
  </form>
</div>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx0TSvfxL7gI5oSxrgB3VHCWHn0TiYXP13HoBUkChEhTll5LDLroQKLFFRfYAv_mY1Y4Q/exec";

  // ✅ 주소가 필요한 상품 목록 (여기만 관리!)
  const NEED_ADDRESS_PRODUCTS = [
    "동원참치선물세트18호",
    "제주천혜향 4KG(9~12과)",
    "스텐냄비 4종세트",
    "한입LA갈비&돈황구이(2KG)"
  ];

  let _loadedAddress = { address:"", detail:"" };

function selectProduct(cardEl, name) {
  document.getElementById("product").value = name;

  // 모든 카드 선택 해제
  document.querySelectorAll('.card-product').forEach(el => {
    el.classList.remove('selected');
    const badge = el.querySelector('.badge-selected');
    if (badge) badge.remove();
  });

  // 현재 선택 카드 강조 + 배지 추가
  cardEl.classList.add('selected');
  const badge = document.createElement('div');
  badge.className = 'badge-selected';
  badge.innerText = '선택됨';
  cardEl.appendChild(badge);

  // ✅ 주소 영역 표시 여부
  const needAddr = NEED_ADDRESS_PRODUCTS.includes(name);
  document.getElementById("addressSection").style.display = needAddr ? "block" : "none";

  // ✅ 주소 UI 초기화
  if (needAddr) resetAddressUI();
}

function resetAddressUI(){
  document.getElementById("addrPreview").classList.add("d-none");
  document.getElementById("btnAddrSearch").classList.add("d-none");
  document.getElementById("addrEditActions").classList.add("d-none");

  document.getElementById("address").value = "";
  document.getElementById("detailAddress").value = "";
  document.getElementById("detailAddress").readOnly = true;

  document.getElementById("addr_source").value = "";
  document.getElementById("addr_updated").value = "0";

  _loadedAddress = { address:"", detail:"" };
}

  function execDaumPostcode() {
    new daum.Postcode({
      oncomplete: function(data) {
        document.getElementById("address").value = data.roadAddress;
      }
    }).open();
  }

  document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const data = {};
    formData.forEach((v, k) => data[k] = v);

    if (!data.name || data.name.trim() === "") {
      Swal.fire("⚠️ 확인", "성명을 입력해주세요.", "warning");
      return;
    }
    if (!data.tel || data.tel.trim() === "") {
      Swal.fire("⚠️ 확인", "연락처를 입력해주세요.", "warning");
      return;
    }
    if (!data.product || data.product.trim() === "") {
      Swal.fire("⚠️ 확인", "선물을 선택해주세요.", "warning");
      return;
    }

    // ✅ 주소가 필요한 상품만 주소 필수 체크
    if (NEED_ADDRESS_PRODUCTS.includes(data.product)) {
      if (!data.address || data.address.trim() === "") {
        Swal.fire("⚠️ 확인", "배송지 주소를 입력해주세요.", "warning");
        return;
      }
      if (!data.detailAddress || data.detailAddress.trim() === "") {
        Swal.fire("⚠️ 확인", "상세주소를 입력해주세요.", "warning");
        return;
      }
    }

    // ✅ 확인창에서도 동일 조건 사용
    let confirmHtml = `
      <p>🙋 이름: <b>${data.name}</b></p>
      <p>📱 연락처: <b>${data.tel}</b></p>
      <p>🛍️ 선택 선물: <b>${data.product}</b></p>`;

    if (NEED_ADDRESS_PRODUCTS.includes(data.product)) {
  if (!data.address || data.address.trim() === "") {
    Swal.fire("⚠️ 확인", "배송지 주소를 입력해주세요.", "warning");
    return;
  }
  if (!data.detailAddress || data.detailAddress.trim() === "") {
    Swal.fire("⚠️ 확인", "상세주소를 입력해주세요.", "warning");
    return;
  }
}

    confirmHtml += `<p>💬 메세지: <b>${data.message || "-"}</b></p>`;

    const result = await Swal.fire({
      title:"제출 전 확인해주세요!",
      html: confirmHtml,
      icon:"question",
      showCancelButton:true,
      confirmButtonText:"제출하기",
      cancelButtonText:"취소"
    });
    if (!result.isConfirmed) return;

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "📤제출중...잠시만 기다려주세요";

    try {
      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" },
        mode: "no-cors"
      });

      Swal.fire("✅ 완료","잘 제출 되었습니다!","success");
      form.reset();
      document.getElementById("addressSection").style.display = "none";

      document.querySelectorAll('.card-product').forEach(el => {
        el.classList.remove('selected');
        const badge = el.querySelector('.badge-selected');
        if (badge) badge.remove();
      });

    } catch (err) {
      Swal.fire("❌ 오류","제출 중 문제가 발생했습니다.","error");
    } finally {
      btn.disabled = false;
      btn.textContent = "✅제출하기";
    }
  });

  // ✅ GAS 주소조회 (읽을 수 있어야 하므로 JSONP 방식 사용)
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "__addr_cb_" + Date.now() + "_" + Math.floor(Math.random()*1000);
    window[cb] = (data) => {
      try { resolve(data); } finally {
        delete window[cb];
        script.remove();
      }
    };
    const script = document.createElement("script");
    script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    script.onerror = () => {
      delete window[cb];
      script.remove();
      reject(new Error("JSONP load failed"));
    };
    document.body.appendChild(script);
  });
}

function onlyDigits(s){ return (s||"").toString().replace(/\D/g,""); }

async function checkAddressFromSheet(){
  const name = (document.querySelector('[name="name"]').value || "").trim();
  const tel  = onlyDigits(document.querySelector('[name="tel"]').value || "");

  if(!name){
    Swal.fire("⚠️ 확인","성명을 먼저 입력해주세요.","warning");
    return;
  }

  // (선택) 연락처까지 있으면 더 정확히 매칭
  const url = GAS_URL + "?action=getAddress&name=" + encodeURIComponent(name) + "&tel=" + encodeURIComponent(tel);

  const btn = document.getElementById("btnAddrCheck");
  btn.disabled = true;
  btn.innerHTML = "🔎등록된 주소 조회중...잠시기다려 주세요";

  try{
    const res = await jsonp(url);

    if(!res || !res.ok){
      Swal.fire("❌ 오류", (res && res.message) ? res.message : "주소 조회에 실패했습니다.", "error");
      return;
    }

    if(!res.found){
      // 시트에 없으면 바로 변경모드로
      Swal.fire("ℹ️ 안내","등록된 주소가 없어서 직접 입력 모드로 전환합니다.","info");
      enableAddressEdit(true); // force
      document.getElementById("addr_source").value = "manual";
      return;
    }

    // ✅ 불러온 값 채우기
    _loadedAddress = { address: res.address || "", detail: res.detailAddress || "" };

    document.getElementById("address").value = _loadedAddress.address;
    document.getElementById("detailAddress").value = _loadedAddress.detail;

    document.getElementById("detailAddress").readOnly = true;
    document.getElementById("btnAddrSearch").classList.add("d-none");
    document.getElementById("addrEditActions").classList.add("d-none");

    // ✅ 미리보기 표시
    document.getElementById("previewAddress").textContent = _loadedAddress.address || "-";
    document.getElementById("previewDetail").textContent  = _loadedAddress.detail || "-";
    document.getElementById("addrPreview").classList.remove("d-none");

    // ✅ 제출 메타
    document.getElementById("addr_source").value = "sheet";
    document.getElementById("addr_updated").value = "0";

    // 중복 가능성 알림(옵션)
    if(res.duplicateCount && res.duplicateCount > 1){
      Swal.fire("ℹ️ 안내", "동명이인이 있어 첫 번째 주소로 불러왔어요. 다르면 ‘변경하기’로 수정해주세요.", "info");
    }

  }catch(err){
    Swal.fire("❌ 오류","주소 조회 중 문제가 발생했습니다.","error");
  }finally{
    btn.disabled = false;
    btn.innerHTML = "📌 주소확인";
  }
}

function enableAddressEdit(force=false){
  // force=true: 시트주소가 없어도 바로 편집모드
  document.getElementById("btnAddrSearch").classList.remove("d-none");
  document.getElementById("detailAddress").readOnly = false;
  document.getElementById("addrEditActions").classList.remove("d-none");

  // 이미 시트주소가 있으면 미리보기는 유지
  if(force){
    document.getElementById("addrPreview").classList.add("d-none");
  }
}

function confirmAddressEdit(){
  const addr = (document.getElementById("address").value || "").trim();
  const det  = (document.getElementById("detailAddress").value || "").trim();

  if(!addr){
    Swal.fire("⚠️ 확인","주소를 입력(검색)해주세요.","warning");
    return;
  }
  if(!det){
    Swal.fire("⚠️ 확인","상세주소를 입력해주세요.","warning");
    return;
  }

  // ✅ 변경 확정: 읽기 전용 + 미리보기 갱신
  document.getElementById("detailAddress").readOnly = true;
  document.getElementById("btnAddrSearch").classList.add("d-none");
  document.getElementById("addrEditActions").classList.add("d-none");

  document.getElementById("previewAddress").textContent = addr;
  document.getElementById("previewDetail").textContent  = det;
  document.getElementById("addrPreview").classList.remove("d-none");

  document.getElementById("addr_source").value = "manual";
  document.getElementById("addr_updated").value = "1";
}

function cancelAddressEdit(){
  // ✅ 원래(시트에서 불러온 값)로 되돌림
  document.getElementById("address").value = _loadedAddress.address || "";
  document.getElementById("detailAddress").value = _loadedAddress.detail || "";
  document.getElementById("detailAddress").readOnly = true;

  document.getElementById("btnAddrSearch").classList.add("d-none");
  document.getElementById("addrEditActions").classList.add("d-none");

  document.getElementById("previewAddress").textContent = _loadedAddress.address || "-";
  document.getElementById("previewDetail").textContent  = _loadedAddress.detail || "-";
  document.getElementById("addrPreview").classList.remove("d-none");

  document.getElementById("addr_source").value = "sheet";
  document.getElementById("addr_updated").value = "0";
}

// ✅ 주소검색 시: 변경 플래그 자동 ON
function execDaumPostcode() {
  new daum.Postcode({
    oncomplete: function(data) {
      document.getElementById("address").value = data.roadAddress;
      document.getElementById("addr_source").value = "manual";
      document.getElementById("addr_updated").value = "1";
    }
  }).open();
}

</script>
</body>
</html>
