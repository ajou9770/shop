<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 고우회 명절선물신청</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- 카카오 도로명주소 API -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>
    body { background: #f8f9fa; }
    .card-product { 
      cursor: pointer; 
      transition: transform .2s, border .2s; 
      border: 2px solid transparent;
      position: relative;
    }
    .card-product:hover { 
      transform: scale(1.05); 
      box-shadow:0 6px 18px rgba(0,0,0,.1); 
    }
    .card-product.selected {
      border: 3px solid #0d6efd;   /* 파란색 테두리 */
      box-shadow: 0 0 10px rgba(13,110,253,.5);
    }
    .badge-selected {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #0d6efd;
      color: white;
      font-size: .8rem;
      padding: .3em .6em;
      border-radius: 1rem;
    }
    .swal2-popup { font-size: 1rem !important; }
  </style>
</head>
<body>

<div class="container py-4">
  <h3 class="mb-4 text-center">🎁 고우회 명절선물 신청하기</h3>

  <form id="orderForm" class="card p-4 shadow-sm border-0">
    <!-- <div class="mb-3">
      <label class="form-label">🙋 성명</label>
      <input type="text" name="name" class="form-control" required>
    </div> -->
    <div class="mb-3">
  <label class="form-label">🙋 성명</label>
  <input list="nameList" type="text" name="name" class="form-control" placeholder="이름을 입력하거나 선택하세요" required>
  <datalist id="nameList">
    <option value="권세혁">
    <option value="권용석">
    <option value="김경덕">
    <option value="김동석">
    <option value="김상섭">
    <option value="김설호">
    <option value="김태동">
    <option value="박수영">
    <option value="박종호">
    <option value="손병욱">
    <option value="최진철">
    <option value="정승교">
    <option value="정재영">
    <option value="황춘석">
  </datalist>
</div>


    <div class="mb-3">
      <label class="form-label">📱연락처</label>
      <input type="tel" name="tel" class="form-control" placeholder="숫자만입력하세요" required>
    </div>

    <!-- 상품선택 -->
    <div class="mb-3">
      <label class="form-label">🛍️ 선물을 선택해 주세요</label><br>
      <span>🧩자세한 상품정보는 특판몰을 참조해 주세요</span>
      <div class="row g-3">
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'동원참치선물세트18호')">
            <img src="https://ajoucu.com/web/product/medium/202601/fc25443d3689906fa6b3cb30de80b3a5.jpg" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">동원참치선물세트18호</h6></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'제주천혜향 4KG(9~12과)')">
            <img src="https://ajoucu.com/web/product/medium/202301/9133e8daf9d4cbc2ba56c319dc1cd0cf.jpg" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">제주천혜향 4KG(9~12과)</h6></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'스텐냄비 4종세트')">
            <img src="https://ajoucu.com/web/product/medium/202601/a3b7fa9997666bf09d009af1903d1950.jpg" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">스텐냄비 4종세트</h6></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card card-product h-100" onclick="selectProduct(this,'한입LA갈비&돈황구이(2KG)')">
            <img src="https://ajoucu.com/web/product/medium/202601/d98aadc0c8841e678e9dafaba380da2a.png" class="card-img-top">
            <div class="card-body text-center"><h6 class="card-title">한입LA갈비&돈황구이(2KG)</h6></div>
          </div>
        </div>
      </div>
      <input type="hidden" name="product" id="product" required>
    </div>

    <!-- 주소 입력 (상품A~C 선택 시만 보임) -->
    <div id="addressSection" style="display:none;">
      <div class="mb-3">
        <label class="form-label">🏠 배송지(도로명주소)</label>
        <div class="input-group">
          <input type="text" name="address" id="address" class="form-control" placeholder="우측에 주소검색하여 입력하세요" readonly>
          <button type="button" class="btn btn-outline-secondary" onclick="execDaumPostcode()">📍주소검색</button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">🏢 동,호수 등 상세주소</label>
        <input type="text" name="detailAddress" id="detailAddress" class="form-control">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">💬 기타 남기실 말씀</label>
      <textarea name="message" rows="2" class="form-control" placeholder="자유롭게 입력해주세요"></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2">
      ✅제출하기
    </button>
  </form>
</div>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbx0TSvfxL7gI5oSxrgB3VHCWHn0TiYXP13HoBUkChEhTll5LDLroQKLFFRfYAv_mY1Y4Q/exec";

  // ✅ 주소가 필요한 상품 목록 (여기만 관리!)
  const NEED_ADDRESS_PRODUCTS = [
    "동원참치선물세트18호",
    "제주천혜향 4KG(9~12과)",
    "스텐냄비 4종세트",
    "한입LA갈비&돈황구이(2KG)"
  ];

  function selectProduct(cardEl, name) {
    document.getElementById("product").value = name;

    // 모든 카드 선택 해제
    document.querySelectorAll('.card-product').forEach(el => {
      el.classList.remove('selected');
      const badge = el.querySelector('.badge-selected');
      if (badge) badge.remove();
    });

    // 현재 선택 카드 강조 + 배지 추가
    cardEl.classList.add('selected');
    const badge = document.createElement('div');
    badge.className = 'badge-selected';
    badge.innerText = '선택됨';
    cardEl.appendChild(badge);

    // ✅ 주소 입력창 표시/숨김
    document.getElementById("addressSection").style.display =
      NEED_ADDRESS_PRODUCTS.includes(name) ? "block" : "none";
  }

  function execDaumPostcode() {
    new daum.Postcode({
      oncomplete: function(data) {
        document.getElementById("address").value = data.roadAddress;
      }
    }).open();
  }

  document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const data = {};
    formData.forEach((v, k) => data[k] = v);

    if (!data.name || data.name.trim() === "") {
      Swal.fire("⚠️ 확인", "성명을 입력해주세요.", "warning");
      return;
    }
    if (!data.tel || data.tel.trim() === "") {
      Swal.fire("⚠️ 확인", "연락처를 입력해주세요.", "warning");
      return;
    }
    if (!data.product || data.product.trim() === "") {
      Swal.fire("⚠️ 확인", "선물을 선택해주세요.", "warning");
      return;
    }

    // ✅ 주소가 필요한 상품만 주소 필수 체크
    if (NEED_ADDRESS_PRODUCTS.includes(data.product)) {
      if (!data.address || data.address.trim() === "") {
        Swal.fire("⚠️ 확인", "배송지 주소를 입력해주세요.", "warning");
        return;
      }
      if (!data.detailAddress || data.detailAddress.trim() === "") {
        Swal.fire("⚠️ 확인", "상세주소를 입력해주세요.", "warning");
        return;
      }
    }

    // ✅ 확인창에서도 동일 조건 사용
    let confirmHtml = `
      <p>🙋 이름: <b>${data.name}</b></p>
      <p>📱 연락처: <b>${data.tel}</b></p>
      <p>🛍️ 선택 선물: <b>${data.product}</b></p>`;

    if (NEED_ADDRESS_PRODUCTS.includes(data.product)) {
      confirmHtml += `
        <p>🏠 주소: <b>${data.address || "-"}</b></p>
        <p>🏢 상세주소: <b>${data.detailAddress || "-"}</b></p>`;
    }

    confirmHtml += `<p>💬 메세지: <b>${data.message || "-"}</b></p>`;

    const result = await Swal.fire({
      title:"제출 전 확인해주세요!",
      html: confirmHtml,
      icon:"question",
      showCancelButton:true,
      confirmButtonText:"제출하기",
      cancelButtonText:"취소"
    });
    if (!result.isConfirmed) return;

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "📤제출중...잠시만 기다려주세요";

    try {
      await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" },
        mode: "no-cors"
      });

      Swal.fire("✅ 완료","잘 제출 되었습니다!","success");
      form.reset();
      document.getElementById("addressSection").style.display = "none";

      document.querySelectorAll('.card-product').forEach(el => {
        el.classList.remove('selected');
        const badge = el.querySelector('.badge-selected');
        if (badge) badge.remove();
      });

    } catch (err) {
      Swal.fire("❌ 오류","제출 중 문제가 발생했습니다.","error");
    } finally {
      btn.disabled = false;
      btn.textContent = "✅제출하기";
    }
  });
</script>
</body>
</html>
