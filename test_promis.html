<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계약서 입력 폼</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 서명 입력 캔버스 스타일 */
    #signature-pad {
      border: 1px solid #ced4da;
      border-radius: .25rem;
      width: 100%;
      height: 200px;
    }
    .form-check-label {
        font-size: 1.0rem;  /* 텍스트 크기 증가 */
        font-weight: bold;  /* 굵은 글씨 */
        color: #333;        /* 다소 진한 색상 */
        background-color: #f8f9fa; /* 연한 배경색 */
        padding: 10px;
        border-radius: 5px;
      }
      
      .form-check-input {
        transform: scale(1.3); /* 체크박스 크기 확대 */
        margin-right: 10px;
      }
      
  </style>
</head>
<body>
  <div class="container mt-5">
    <h3 class="mb-4">| 전자 계약서 |</h3>
    <form id="contractForm">
      <!-- 기본 정보 입력 -->
      <div class="mb-3">
        <label for="name" class="form-label">🤵대표(대리인)자 이름</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="이름을 입력하세요" required>
      </div>
      <div class="mb-3">
        <label for="recipientEmail" class="form-label">📧대표자(대리인) 이메일</label>
        <input type="email" class="form-control" id="recipientEmail" name="recipientEmail" placeholder="수신인 이메일을 입력하세요" required>
      </div>
      <!-- 계약서 내용 입력 (textarea 사용) -->
      <div class="mb-3">
        <label for="contractText" class="form-label">📄계약서 내용 (꼼꼼히 확인 하세요)</label>
        <textarea class="form-control" id="contractText" name="contractText" rows="20" readonly>
요청 배경
본 병원의 응급실에서 응급환자 내원 중 발생한 장신구(금반지 추정) 분실과 관련하여, 병원 경영진 측에서 일부 배상금을 간호사 및 관리자(파트장, 팀장)에게 분담하도록 결정한 것에 대해, 관련 법적 근거를 검토한 결과 문제가 될 가능성이 있어 이에 대한 재고를 요청드립니다.

관련 법적 근거
• 민법 제756조(사용자의 배상책임)
  응급처치 과정에서의 장신구 분실은 의료진 개개인이 아닌 병원이 사용자 책임을 부담해야 하는 사안입니다.
• 근로기준법 제43조(임금 지급의 원칙)
  근로자의 동의 없이 급여에서 배상금을 공제하거나 부담을 지우는 것은 위법 소지가 큽니다.
• 근로기준법 제20조(강제 저금 금지)
  근로자에게 강제로 금전적 부담을 지우는 행위는 법적으로 금지되어 있으며, 이를 위반할 경우 처벌될 수 있습니다.
• 부당 노동행위 및 인사권 남용 가능성
  직원이 부당한 배상 부담을 거부할 경우, 인사권을 이용한 불이익이 발생할 경우 이는 노동위원회에 부당 노동행위로 제소될 수 있습니다.

주요 문제점
• 응급처치 과정에서 불가피하게 발생한 분실에 대한 책임을 직원 개인에게 전가하는 것은 부당합니다.
• 병원이 이를 강제할 경우, 근로기준법 및 민법 위반으로 법적 분쟁 가능성이 높아집니다.
• 배상금 분담을 거부하는 직원에 대한 인사상 불이익 발생 시, 추가적인 법적 문제가 야기될 수 있습니다.

요청 사항
• 본 사안에 대해 병원 경영진의 배상금 분담 결정 재검토 요청
• 직원 개인의 부담이 아닌 병원의 사용자 책임 원칙 적용 고려
• 향후 유사 사례 방지를 위한 응급실 내 환자 소지품 보관 절차 강화 검토

본 요청은 병원의 법적 리스크를 최소화하고, 직원들의 근로 환경을 보호하기 위한 합리적인 개선을 위한 것입니다. 이에 대해 신중한 검토를 부탁드립니다.

파트장 일동
        </textarea>
      </div>
      
      <!-- 계약내용 확인 및 동의-->
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="agreement" name="agreement" required>
        <label class="form-check-label" for="agreement">
          상기 계약내용을 충분히 읽고 이해 하였습니다.
        </label>
      </div>
      <div class="mb-3">
        <label for="contractDate" class="form-label">📆계약일자</label>
        <input type="date" class="form-control" id="contractDate" name="contractDate" required>
      </div>
      
      <!-- 서명 입력 -->
      <div class="mb-3">
        <label class="form-label">📝서명 [아래에 대표자(대리인)가 서명하세요]</label>
        <canvas id="signature-pad" class="mb-3" style="border: 1px solid #ced4da; border-radius: .25rem; width: 100%; height: 200px;"></canvas>
        <button type="button" id="clearSignature" class="btn btn-secondary btn-sm mt-2">🔄 서명 지우기</button>       
      </div>
      <button type="submit" class="btn btn-primary btn-block">✔제출 하기</button>
    </form>
    <div id="result" class="mt-4"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <script>
    const canvas = document.getElementById('signature-pad');
    const clearButton = document.getElementById('clearSignature');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    
    // SignaturePad 초기화 (먼저 초기화)
    const signaturePad = new SignaturePad(canvas, {
      penColor: 'gray',
      minWidth: 1,
      maxWidth: 2.5,
    });
    
    // resizeCanvas 함수: devicePixelRatio 반영
    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear(); // 캔버스 재설정 후 서명 초기화
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    clearButton.addEventListener('click', () => {
      signaturePad.clear();
    });  

  // 폼 제출 시, 서명 데이터를 가져와서 폼 데이터에 추가 후 전송
  document.getElementById('contractForm').addEventListener('submit', function(e) {
    e.preventDefault();
    // 서명이 비어있는지 체크
    if (signaturePad.isEmpty()) {
      alert("서명을 해주세요.");
      return;
    }
    const signatureDataUrl = signaturePad.toDataURL();
    console.log("서명 데이터:", signatureDataUrl);
    
    // 예시: 폼 데이터를 구성하여 전송 (나머지 데이터 처리)
    const formData = new FormData(e.target);
    formData.append('signature', signatureDataUrl);
    
    // 예시: 구글앱스크립트 웹앱 URL로 전송
    const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_WEBAPP_URL';
    fetch(scriptURL, { method: 'POST', body: formData })
      .then(response => response.text())
      .then(result => {
        console.log('제출 결과:', result);
        // 추가 처리
      })
      .catch(error => {
        console.error('에러 발생:', error);
      });
  });

      // 폼 제출 이벤트 리스너 (하나로 통합)
      document.getElementById('contractForm').addEventListener('submit', function(e) {
        e.preventDefault();

        alert('🤷‍♂️문서가 제출됩니다. 잠시 기다려 주세요');
        const name = document.getElementById('name').value;
        const contractDate = document.getElementById('contractDate').value;
        const recipientEmail = document.getElementById('recipientEmail').value;
        const signatureDataUrl = canvas.toDataURL('image/png');
        const contractText = document.getElementById('contractText').value;

        const formData = new FormData();
        formData.append('name', name);
        formData.append('contractDate', contractDate);
        formData.append('recipientEmail', recipientEmail);
        formData.append('signature', signatureDataUrl);
        formData.append('contractText', contractText);

        const scriptURL = 'https://script.google.com/macros/s/AKfycbz6MhAaQyD3iDNdzMSl7tTuBQFSNtk4emR6p4oWDTfZCqQDQEnSpnfl1KqmiN79QOtk/exec';
        fetch(scriptURL, { method: 'POST', body: formData })
          .then(response => response.text())
          .then(result => {
            alert('🚀계약서가 정상 제출되었습니다.');
            document.getElementById('result').innerText = '제출 결과: ' + result;
            // 3초 후에 입력폼 리셋
            setTimeout(() => {
              document.getElementById('contractForm').reset();
              // textarea는 reset() 시 기본값으로 돌아갑니다.
              ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 3000);
          })
          .catch(error => {
            document.getElementById('result').innerText = '에러 발생: ' + error;
          });
      });
  </script>
</body>
</html>
